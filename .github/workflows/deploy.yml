name: 🚀 Deploy Invictus Mobile Dashboard (모바일 사령부 배포)

on:
  schedule:
    # 1. 한국 시간 아침 07:40 KST 기동 (UTC 일~목 22:40)
    - cron: '40 22 * * 0-4'
    # 2. 한국 시간 장마감 후 15:45 KST 기동 (UTC 월~금 06:45)
    - cron: '45 6 * * 1-5'
  workflow_dispatch:  # 수동 즉시 갱신

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests yfinance cryptography

      - name: Build Encrypted Payload
        env:
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN || '7777' }}
        run: python builder.py

      - name: Commit and Push Updated Payload
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "dashboard-bot@invictus.local"
          git add payload.json
          git diff --cached --quiet || git commit -m "🚀 Update encrypted dashboard payload [skip ci]"
          git push || true
