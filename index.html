<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>인빅투스 프리즘 | 모바일 사령부</title>
  
  <!-- PWA & Mobile Web App Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="인빅투스사령부">
  <meta name="theme-color" content="#0B0E14">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <style>
    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #0B0E14;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
    }
    .neon-border {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
      border-color: rgba(0, 240, 255, 0.3);
    }
    .neon-text {
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }
    .glass-card {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-green {
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }
    .glow-red {
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }
  </style>
</head>
<body class="min-h-screen pb-12 flex flex-col items-center">

  <!-- ========================================== -->
  <!-- 1. PIN 보안 인증 화면 (잠금 모드) -->
  <!-- ========================================== -->
  <div id="authScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#0B0E14] px-6">
    <div class="w-full max-w-sm glass-card rounded-3xl p-8 flex flex-col items-center neon-border text-center">
      
      <!-- 휘장 아이콘 -->
      <div class="w-16 h-16 rounded-2xl bg-cyan-950/60 border border-cyan-500/40 flex items-center justify-center mb-4 text-cyan-400">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      
      <h1 class="text-xl font-bold tracking-wider text-white neon-text mb-1">인빅투스 프리즘 사령부</h1>
      <p class="text-xs text-slate-400 mb-6">1급 보안 데이터 암호화 구역 (AES-256)</p>
      
      <!-- PIN 인디케이터 (4개 점) -->
      <div class="flex items-center justify-center space-x-4 mb-6">
        <div id="dot-0" class="w-4 h-4 rounded-full border border-slate-600 transition-all duration-200"></div>
        <div id="dot-1" class="w-4 h-4 rounded-full border border-slate-600 transition-all duration-200"></div>
        <div id="dot-2" class="w-4 h-4 rounded-full border border-slate-600 transition-all duration-200"></div>
        <div id="dot-3" class="w-4 h-4 rounded-full border border-slate-600 transition-all duration-200"></div>
      </div>
      
      <!-- 에러 메시지 -->
      <div id="authError" class="text-xs text-rose-400 h-5 mb-2 font-medium opacity-0 transition-opacity">
        PIN 번호가 일치하지 않습니다
      </div>
      
      <!-- 가상 키패드 -->
      <div class="grid grid-cols-3 gap-3 w-full max-w-xs mb-4">
        <button onclick="pressKey('1')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">1</button>
        <button onclick="pressKey('2')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">2</button>
        <button onclick="pressKey('3')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">3</button>
        <button onclick="pressKey('4')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">4</button>
        <button onclick="pressKey('5')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">5</button>
        <button onclick="pressKey('6')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">6</button>
        <button onclick="pressKey('7')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">7</button>
        <button onclick="pressKey('8')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">8</button>
        <button onclick="pressKey('9')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">9</button>
        <button onclick="clearPin()" class="h-14 rounded-2xl bg-slate-900/60 hover:bg-slate-800/60 active:scale-95 text-xs font-semibold text-slate-400 transition-all flex items-center justify-center">초기화</button>
        <button onclick="pressKey('0')" class="h-14 rounded-2xl bg-slate-800/60 hover:bg-slate-700/60 active:scale-95 text-lg font-semibold text-white transition-all">0</button>
        <button onclick="backspacePin()" class="h-14 rounded-2xl bg-slate-900/60 hover:bg-slate-800/60 active:scale-95 text-xs font-semibold text-slate-400 transition-all flex items-center justify-center">
          <i data-lucide="delete" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- 자동 로그인 토글 -->
      <label class="flex items-center space-x-2 text-xs text-slate-400 mt-2 cursor-pointer select-none">
        <input type="checkbox" id="rememberPin" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0">
        <span>이 기기에서 자동 로그인</span>
      </label>
      
    </div>
  </div>


  <!-- ========================================== -->
  <!-- 2. 대시보드 메인 화면 -->
  <!-- ========================================== -->
  <main id="mainDashboard" class="hidden w-full max-w-md px-4 pt-4 flex flex-col space-y-4">
    
    <!-- 탑 네비게이션 헤더 -->
    <header class="flex items-center justify-between py-2">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-cyan-950 border border-cyan-500/50 flex items-center justify-center text-cyan-400">
          <i data-lucide="shield" class="w-4 h-4"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold text-white tracking-wide">인빅투스 센티널 사령부</h1>
          <p id="updatedAtLabel" class="text-[10px] text-slate-400">동기화 중...</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-1">
        <button onclick="reloadDashboard()" class="p-2 rounded-xl bg-slate-800/60 text-slate-300 hover:text-cyan-400 transition-colors">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
        <button onclick="lockScreen()" class="p-2 rounded-xl bg-slate-800/60 text-slate-300 hover:text-rose-400 transition-colors">
          <i data-lucide="lock" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- 💰 총 자산 요약 히어로 카드 -->
    <section class="glass-card rounded-3xl p-5 relative overflow-hidden neon-border">
      <div class="flex justify-between items-start mb-2">
        <span class="text-xs font-semibold text-slate-400 flex items-center gap-1">
          <i data-lucide="wallet" class="w-3.5 h-3.5 text-cyan-400"></i> 사령관님 총 평가자산
        </span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-950 text-cyan-300 border border-cyan-500/30">
          LIVE V1.0
        </span>
      </div>
      
      <div class="flex items-baseline space-x-2 mb-3">
        <h2 id="totalAssetValue" class="text-3xl font-extrabold text-white tracking-tight">0원</h2>
      </div>
      
      <div class="grid grid-cols-2 gap-2 pt-3 border-t border-slate-800/80 text-xs">
        <div>
          <p class="text-[11px] text-slate-400">총 평가손익</p>
          <p id="totalProfitAmount" class="font-bold text-sm text-slate-200">0원</p>
        </div>
        <div>
          <p class="text-[11px] text-slate-400">총 수익률</p>
          <p id="totalProfitRate" class="font-bold text-sm text-slate-200">0.00%</p>
        </div>
        <div>
          <p class="text-[11px] text-slate-400">총 매수원금</p>
          <p id="totalCostValue" class="font-medium text-slate-300">0원</p>
        </div>
        <div>
          <p class="text-[11px] text-slate-400">비상 탄약(예수금)</p>
          <p id="reservedCashValue" class="font-medium text-cyan-400">33,914원</p>
        </div>
      </div>
    </section>

    <!-- 🌐 글로벌 매크로 미니 카드 스크롤러 -->
    <section>
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <i data-lucide="globe" class="w-3.5 h-3.5 text-cyan-400"></i> 야간 글로벌 매크로 지표
      </h3>
      <div id="macroContainer" class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
        <!-- JS 렌더링 -->
      </div>
    </section>

    <!-- 🛡️ 사령관님 4대 전선별 실시간 현황 카드 -->
    <section>
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="swords" class="w-3.5 h-3.5 text-cyan-400"></i> 사령관님 4대 보유 전선
        </h3>
        <span class="text-[10px] text-slate-500">4대 핵심 자산</span>
      </div>
      <div id="stocksContainer" class="flex flex-col space-y-3">
        <!-- JS 렌더링 -->
      </div>
    </section>

    <!-- 📜 사령관님 오늘의 행동 수칙 (Tactical Action Orders) -->
    <section class="glass-card rounded-2xl p-4 border border-slate-800">
      <h3 class="text-xs font-bold text-amber-400 flex items-center gap-1.5 mb-2.5">
        <i data-lucide="compass" class="w-4 h-4"></i> 인빅투스 프리즘 금일 작전 지침
      </h3>
      <ul id="tacticalOrdersList" class="flex flex-col space-y-2 text-xs text-slate-300">
        <!-- JS 렌더링 -->
      </ul>
    </section>

    <!-- 푸터 -->
    <footer class="pt-4 pb-8 text-center text-[10px] text-slate-600">
      <p>인빅투스 프리즘 연합 센티널 퀀트랩</p>
      <p class="mt-0.5">End-to-End 군사보안 AES-GCM 256-bit 암호화 보호 체계</p>
    </footer>

  </main>


  <!-- ========================================== -->
  <!-- 3. 핵심 로직 & Web Crypto 복호화 스크립트 -->
  <!-- ========================================== -->
  <script>
    let currentPin = "";
    let cachedPayload = null;

    // 초기화
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      checkSavedPin();
    });

    // 16진수 문자열 -> 바이트 배열 변환
    function hexToBytes(hex) {
      const bytes = new Uint8Array(hex.length / 2);
      for (let i = 0; i < hex.length; i += 2) {
        bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
      }
      return bytes;
    }

    // Web Crypto API 기반 AES-GCM 256비트 복호화
    async function decryptPayload(encryptedData, pin) {
      const enc = new TextEncoder();
      const salt = hexToBytes(encryptedData.salt);
      const iv = hexToBytes(encryptedData.iv);
      const ciphertextWithTag = hexToBytes(encryptedData.ciphertext);

      const keyMaterial = await window.crypto.subtle.importKey(
        "raw",
        enc.encode(pin),
        { name: "PBKDF2" },
        false,
        ["deriveKey"]
      );

      const key = await window.crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: salt,
          iterations: 100000,
          hash: "SHA-256"
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );

      const decrypted = await window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        ciphertextWithTag
      );

      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    // 키패드 입력
    function pressKey(num) {
      if (currentPin.length < 4) {
        currentPin += num;
        updateDots();
        if (currentPin.length === 4) {
          setTimeout(validatePin, 50);
        }
      }
    }

    function clearPin() {
      currentPin = "";
      updateDots();
      hideError();
    }

    function backspacePin() {
      if (currentPin.length > 0) {
        currentPin = currentPin.slice(0, -1);
        updateDots();
        hideError();
      }
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i < currentPin.length) {
          dot.classList.add("bg-cyan-400", "border-cyan-400", "shadow-[0_0_8px_#00F0FF]");
        } else {
          dot.classList.remove("bg-cyan-400", "border-cyan-400", "shadow-[0_0_8px_#00F0FF]");
        }
      }
    }

    function showError(msg) {
      const el = document.getElementById("authError");
      el.textContent = msg || "PIN 번호가 일치하지 않습니다";
      el.classList.remove("opacity-0");
      setTimeout(() => {
        clearPin();
      }, 500);
    }

    function hideError() {
      document.getElementById("authError").classList.add("opacity-0");
    }

    // 저장된 PIN 검사 (자동 로그인)
    function checkSavedPin() {
      const saved = localStorage.getItem("invictus_dashboard_pin");
      if (saved && saved.length === 4) {
        currentPin = saved;
        document.getElementById("rememberPin").checked = true;
        validatePin();
      }
    }

    // PIN 검증 및 복호화 실행
    async function validatePin() {
      try {
        const res = await fetch("payload.json?t=" + new Date().getTime());
        if (!res.ok) {
          showError("서버 페이로드를 찾을 수 없습니다.");
          return;
        }
        const encData = await res.json();
        const decrypted = await decryptPayload(encData, currentPin);

        // 성공
        cachedPayload = decrypted;
        if (document.getElementById("rememberPin").checked) {
          localStorage.setItem("invictus_dashboard_pin", currentPin);
        } else {
          localStorage.removeItem("invictus_dashboard_pin");
        }

        renderDashboard(decrypted);
        document.getElementById("authScreen").classList.add("hidden");
        document.getElementById("mainDashboard").classList.remove("hidden");
      } catch (err) {
        console.error("복호화 실패:", err);
        showError("보안 PIN 인증에 실패했습니다");
      }
    }

    // 대시보드 화면 렌더링
    function renderDashboard(data) {
      document.getElementById("updatedAtLabel").textContent = "동기화: " + data.updated_at;

      const h = data.holdings;
      document.getElementById("totalAssetValue").textContent = h.total_assets.toLocaleString() + "원";
      
      const profitEl = document.getElementById("totalProfitAmount");
      const profitRateEl = document.getElementById("totalProfitRate");
      const sign = h.total_profit >= 0 ? "+" : "";
      
      profitEl.textContent = sign + h.total_profit.toLocaleString() + "원";
      profitRateEl.textContent = sign + h.total_profit_rate.toFixed(2) + "%";
      
      if (h.total_profit >= 0) {
        profitEl.className = "font-bold text-sm text-emerald-400";
        profitRateEl.className = "font-bold text-sm text-emerald-400";
      } else {
        profitEl.className = "font-bold text-sm text-rose-400";
        profitRateEl.className = "font-bold text-sm text-rose-400";
      }

      document.getElementById("totalCostValue").textContent = h.total_cost.toLocaleString() + "원";
      document.getElementById("reservedCashValue").textContent = h.reserved_cash.toLocaleString() + "원";

      // 1. 글로벌 매크로 카드 렌더링
      const macroBox = document.getElementById("macroContainer");
      macroBox.innerHTML = "";
      data.macro.forEach(m => {
        const isUp = m.pct >= 0;
        const color = isUp ? "text-emerald-400" : "text-rose-400";
        const signChar = isUp ? "+" : "";
        const div = document.createElement("div");
        div.className = "glass-card rounded-2xl p-3 min-w-[110px] flex-shrink-0 flex flex-col justify-between";
        div.innerHTML = `
          <span class="text-[10px] text-slate-400 font-medium">${m.name}</span>
          <div class="my-1">
            <span class="text-sm font-bold text-white">${m.value.toLocaleString()}</span>
            <span class="text-[9px] text-slate-400 ml-0.5">${m.unit}</span>
          </div>
          <span class="text-[11px] font-semibold ${color}">${signChar}${m.pct.toFixed(2)}%</span>
        `;
        macroBox.appendChild(div);
      });

      // 2. 4대 보유 종목 카드 렌더링
      const stocksBox = document.getElementById("stocksContainer");
      stocksBox.innerHTML = "";
      h.stocks.forEach(s => {
        const isProfit = s.profit >= 0;
        const profitColor = isProfit ? "text-emerald-400" : "text-rose-400";
        const profitBg = isProfit ? "bg-emerald-950/60 border-emerald-500/30 text-emerald-300" : "bg-rose-950/60 border-rose-500/30 text-rose-300";
        const signChar = isProfit ? "+" : "";
        
        const card = document.createElement("div");
        card.className = "glass-card rounded-2xl p-4 border border-slate-800 flex flex-col space-y-2.5 transition-all hover:border-slate-700";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-1.5">
                <h4 class="font-bold text-white text-base">${s.name}</h4>
                <span class="text-[10px] text-slate-500">${s.code}</span>
              </div>
              <span class="inline-block mt-0.5 px-2 py-0.5 rounded text-[9px] font-medium bg-slate-800 text-slate-300 border border-slate-700">
                ${s.badge}
              </span>
            </div>
            <div class="text-right">
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-bold border ${profitBg}">
                ${signChar}${s.profit_rate.toFixed(2)}%
              </span>
              <p class="text-sm font-extrabold text-white mt-1">${s.close_price.toLocaleString()}원</p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-800/70">
            <div>
              <span class="text-[10px] text-slate-400">보유수량 / 평단</span>
              <p class="font-semibold text-slate-200">${s.shares}주 <span class="text-[10px] text-slate-400 font-normal">(@${s.avg_price.toLocaleString()}원)</span></p>
            </div>
            <div>
              <span class="text-[10px] text-slate-400">평가금액 / 손익</span>
              <p class="font-semibold text-slate-200">${s.eval_amount.toLocaleString()}원 <span class="${profitColor} text-[11px]">(${signChar}${s.profit.toLocaleString()}원)</span></p>
            </div>
          </div>

          <div class="bg-slate-900/70 rounded-xl p-2.5 text-[11px] flex justify-between items-center text-slate-300">
            <div>
              <span class="text-slate-500 text-[10px]">핵심 방어선:</span>
              <span class="font-semibold text-amber-400 ml-1">${s.support}</span>
            </div>
            <div>
              <span class="text-slate-500 text-[10px]">목표가:</span>
              <span class="font-semibold text-cyan-400 ml-1">${s.target}</span>
            </div>
          </div>

          <div class="text-[10px] text-slate-400 flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400"></span>
            <span>${s.status}</span>
          </div>
        `;
        stocksBox.appendChild(card);
      });

      // 3. 작전 지침 렌더링
      const ordersList = document.getElementById("tacticalOrdersList");
      ordersList.innerHTML = "";
      data.tactical_orders.forEach(order => {
        const li = document.createElement("li");
        li.className = "flex items-start gap-2";
        li.innerHTML = `<span class="text-cyan-400 font-bold">•</span><span>${order}</span>`;
        ordersList.appendChild(li);
      });

      lucide.createIcons();
    }

    // 새로고침
    function reloadDashboard() {
      validatePin();
    }

    // 화면 잠금
    function lockScreen() {
      currentPin = "";
      updateDots();
      document.getElementById("mainDashboard").classList.add("hidden");
      document.getElementById("authScreen").classList.remove("hidden");
    }

    // 물리 키보드 입력 대응
    document.addEventListener("keydown", (e) => {
      if (document.getElementById("authScreen").classList.contains("hidden")) return;
      if (e.key >= "0" && e.key <= "9") {
        pressKey(e.key);
      } else if (e.key === "Backspace") {
        backspacePin();
      } else if (e.key === "Escape") {
        clearPin();
      }
    });
  </script>
</body>
